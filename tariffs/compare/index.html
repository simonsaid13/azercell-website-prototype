<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare tariffs — Azercell</title>
<meta name="description" content="Compare Azercell mobile tariffs side by side. Pick up to four plans and switch price options within each column.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/tariff-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND:  homepage → Compare all plans, Compare all tariffs;
 *           /tariffs/mobile/ → Compare plans; plan cards → Compare (via ?add=)
 * OUTBOUND:
 *   compare tool → plan details — CONNECTED (all 6 tariffs)
 *   compare tool → Kabinetim / Find store — CONNECTED
 *   compare tool → Browse all tariffs → /tariffs/mobile/ — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  var href = R.href;
  var render = Components.render;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['floatingBar', chrome.floatingBar]]);

  function section(inner, modifier) {
    return '<section class="section' + (modifier ? ' ' + modifier : '') + '"><div class="wrap">' + inner + '</div></section>';
  }

  Components.mount('#page-main', [
    section(
      render('sectionHead', {
        eyebrow: 'Mobile tariffs',
        title: 'Compare plans side by side',
        body: 'Pick at least two tariffs, then switch price options inside each column. Activation always happens in Kabinetim, via USSD, or in store — not on this page.'
      })
    ),

    section(
      render('tariffCompareTool', { tariffs: TariffData.MOBILE_TARIFFS })
    ),

    section(
      render('calloutBanner', {
        eyebrow: 'Need the full list?',
        title: 'Browse every mobile tariff',
        body: 'Filter prepaid, postpaid and data-only plans on the tariffs page. Use Compare on any card to add it here.',
        actions: [
          { label: 'All mobile tariffs', href: href('/tariffs/mobile/'), variant: 'primary' }
        ]
      })
    )
  ]);
})();
</script>
</body>
</html>
