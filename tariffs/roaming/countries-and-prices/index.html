<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countries and prices — Roaming — Azercell</title>
<meta name="description" content="Search roaming destinations for operator networks and pay-as-you-go rates. Sample country list for prototype.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/roaming-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/roaming-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: header → Internet → Roaming → Countries and prices; footer → Roaming packs;
 *           /tariffs/roaming/ hub search; support chat → Countries and prices — CONNECTED
 * OUTBOUND:
 *   catalog nav → hub, internet-packs, travel-packs — CONNECTED
 *   country search → ?country={id} shareable URLs — CONNECTED
 *   cross-sell → internet-packs, hub — CONNECTED
 *   related → sibling roaming pages, internet, mobile — CONNECTED
 * Country URLs: ?country=turkiye|georgia|germany|…
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['supportChat', chrome.supportChat]]);

  RoamingPage.mount('countries');
  PrototypeApp.init();
})();
</script>
</body>
</html>
