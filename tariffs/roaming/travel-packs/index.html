<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel packs — Roaming — Azercell</title>
<meta name="description" content="Tourist prepaid packs for visitors to Azerbaijan. Data, minutes, and free SIM or eSIM via azercellim.com.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/roaming-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/roaming-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: header → Internet → Travel packs; homepage hero → travel packs — CONNECTED
 * OUTBOUND:
 *   pack cards → azercellim.com — CONNECTED (external)
 *   cross-sell → internet-packs — CONNECTED
 *   related → hub, countries, internet-packs, internet, mobile — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['supportChat', chrome.supportChat]]);

  RoamingPage.mount('travel-packs');
  PrototypeApp.init();
})();
</script>
</body>
</html>
