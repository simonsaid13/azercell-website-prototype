<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roaming — Azercell</title>
<meta name="description" content="International roaming overview — search country rates, buy roaming internet packs, and see how to activate before travel.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/roaming-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/roaming-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: header → Internet → Roaming overview; homepage hero → Roaming rates;
 *           /tariffs/mobile/; /tariffs/internet/* related — CONNECTED
 * OUTBOUND:
 *   country search → ?country={id} — CONNECTED
 *   featured pack → internet-packs — CONNECTED
 *   cross-sell → internet-packs, compare — CONNECTED
 *   related → sibling roaming pages, internet, mobile — CONNECTED
 * Country URLs: ?country=turkiye|georgia|germany|…
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['supportChat', chrome.supportChat]]);

  RoamingPage.mount('hub');
  PrototypeApp.init();
})();
</script>
</body>
</html>
