<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiMax — Azercell</title>
<meta name="description" content="DigiMax prepaid packs with internet, countrywide calls and SMS. Choose a pack, see what is included, and activate via Kabinetim, USSD, or SMS to 7575.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/tariff-detail-data.js"></script>
<script src="/assets/js/tariff-detail-data-others.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tariff-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND:  homepage → See DigiMax packs, Plan details on DigiMax card;
 *           /tariffs/mobile/ → Plan details on DigiMax card;
 *           header → Mobile → Popular plans → DigiMax;
 *           /tariffs/compare/ → Plan details on DigiMax column;
 *           archive → See DigiMax promo — CONNECTED
 * OUTBOUND:
 *   carousel → pack cards (one per tier) — CONNECTED
 *   pack card → Kabinetim, Compare — CONNECTED
 *   FAQ → activation codes (first item) + full FAQ — CONNECTED
 *   internet add-ons → /tariffs/internet/monthly/ — CONNECTED
 *   cross-links → /tariffs/compare/, /tariffs/mobile/ — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['supportChat', chrome.supportChat]]);

  TariffPage.mount('digimax');
  PrototypeApp.init();
})();
</script>
</body>
</html>
