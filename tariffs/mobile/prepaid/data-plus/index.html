<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>"Data+" tariff — Azercell</title>
<meta name="description" content="Data-only prepaid packs. No standard voice calls. Video calls and SMS supported.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/tariff-detail-data.js"></script>
<script src="/assets/js/tariff-detail-data-others.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tariff-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND:  homepage + hub Plan details; header → Popular plans → Data+;
 *           compare → Plan details — CONNECTED
 * OUTBOUND: pack carousel → Kabinetim, Compare — CONNECTED
 *           cross-links → /compare/?billing=prepaid, /tariffs/mobile/ — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);
  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['floatingBar', chrome.floatingBar]]);
  TariffPage.mount('data-plus');
  PrototypeApp.init();
})();
</script>
</body>
</html>
