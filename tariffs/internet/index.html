<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet packs — Azercell</title>
<meta name="description" content="Mobile internet add-ons — monthly, weekly, daily, and unlimited bursts. Stack data on your tariff and activate via Kabinetim or SMS.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/internet-pack-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/internet-pack-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: header → Internet → All internet packs; footer → Internet packs — CONNECTED
 * OUTBOUND: category nav → 4 sub-pages; featured cards; compare cross-sell — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['supportChat', chrome.supportChat]]);

  InternetPackPage.mount('hub');
  PrototypeApp.init();
})();
</script>
</body>
</html>
