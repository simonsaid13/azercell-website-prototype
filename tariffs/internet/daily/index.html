<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily internet packs — Azercell</title>
<meta name="description" content="Daily internet add-ons from 350MB to 1.5GB with 24-hour auto-renewal. Activate via Kabinetim or SMS to 2525.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/internet-pack-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/internet-pack-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: header → Internet → Daily; /tariffs/mobile/ upsell — CONNECTED
 * OUTBOUND: category nav, Kabinetim, DigiMax cross-sell — CONNECTED
 * Filter URLs: ?volume=60-500, ?sort=price-asc|price-desc
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['floatingBar', chrome.floatingBar]]);

  InternetPackPage.mount('daily');
  PrototypeApp.init();
})();
</script>
</body>
</html>
