<body>

<script src="/assets/js/site-registry.js"></script>

<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND:  logo, branch switcher (from B2B)
 * OUTBOUND:
 *   hero → Compare all tariffs — CONNECTED (/tariffs/compare/)

 *   acquisitionBlock → Get a number — CONNECTED (azercellim.com)
 *   acquisitionBlock → Transfer your number — CONNECTED (/join-azercell/transfer-number/)

  var render = Components.render;

  var KABINETIM = 'https://kabinetim.azercell.com/my/login';

  /* ---------------------------------------------------------------- Chrome */

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);

  /* Homepage acquisition replaces the old 4-item shortcut row */

  /* ------------------------------------------------------------------ Data */

      body: 'Internet, calls and SMS in a single pack. No contract and no monthly commitment — top up and go.',

        { label: 'Compare all tariffs', href: href('/tariffs/compare/') }

      stats: [
        { value: '25GB', label: 'Internet' },
        { value: '1500 min', label: 'Countrywide calls' },
        { value: '500', label: 'SMS' }
      ]
    },
    {
      eyebrow: 'Premium+ Prepaid',
      title: 'The most data we offer, plus roaming included',
      body: '100GB with 10GB social, 10GB WhatsApp and 3GB roaming data for 90 AZN per 28 days.',

      actions: [

        { value: '100GB', label: 'Internet' },
        { value: '5000 min', label: 'Countrywide calls' },
        { value: '3GB', label: 'Roaming data' }

      actions: [
        { label: 'See travel packs', href: href('/tariffs/roaming/travel-packs/'), variant: 'primary' },
        { label: 'Switch to eSIM', href: href('/tariffs/esim/') }

        { value: '30 days', label: 'Validity' }

      type: 'Prepaid',

      note: 'Balance-linked validity from 5 to 120 days depending on top-up amount.',

        { label: 'Find a store', href: href('/stores/') }

    },
    {
      compareId: 'alfa',
      name: 'Alfa Plan',
      type: 'Postpaid',
      badge: 'Contract',
      tiers: [
        { price: '20 AZN', validity: 'Monthly. 10% off on a 12-month and 20% off on a 24-month contract.', specs: [
          { value: '12GB', label: 'Internet' }, { value: '1200 min', label: 'Calls' }, { value: 'Monthly', label: 'Billing' }] },
        { price: '30 AZN', validity: 'Monthly. Same contract discounts apply.', specs: [
          { value: '25GB', label: 'Internet' }, { value: '2500 min', label: 'Calls' }, { value: 'Monthly', label: 'Billing' }] },
        { price: '40 AZN', validity: 'Monthly. Adds priority call-centre requests.', specs: [
          { value: '40GB', label: 'Internet' }, { value: '4000 min', label: 'Calls' }, { value: 'Monthly', label: 'Billing' }] },
        { price: '60 AZN', validity: 'Monthly. Personal curator and callback service.', specs: [
          { value: '60GB', label: 'Internet' }, { value: '5000 min', label: 'Calls' }, { value: 'Monthly', label: 'Billing' }, { value: '5GB', label: 'Social media' }, { value: '5GB', label: 'WhatsApp' }, { value: '1GB', label: 'Roaming data' }] },
        { price: '90 AZN', validity: 'Monthly. Free mobile customer service.', specs: [

  var devices = [
    { name: 'iPhone 16 Pro', category: 'phones', brand: 'apple', price: '2,949 AZN' },
    { name: 'Galaxy S24 Ultra', category: 'phones', brand: 'samsung', price: '2,899 AZN' },

      body: 'Rates, packs and supported operators for around 190 destinations.', linkLabel: 'Learn more' },
    { media: 'eSIM', title: 'Switch to eSIM', href: href('/tariffs/esim/'),
      body: 'Go fully digital. First issue and transfer are free of charge.', linkLabel: 'Learn more' },
    { media: '5G', title: 'Azercell 5G', href: href('/tariffs/5g/'),
      body: 'The 5G test zone at Fountain Square in Baku, included in your tariff.', linkLabel: 'Learn more' },
    { media: 'Aicell', title: 'Aicell assistant', href: href('/tariffs/services/aicell/'),
      body: 'Free 24/7 assistant for balance, tariffs, roaming and troubleshooting.', linkLabel: 'Learn more' }
  ];

  var reasons = [
    { media: 'Network', title: 'A network built for everyday use', href: href('/tariffs/5g/'),
      body: 'Nationwide coverage with VoLTE HD calling included in every standard tariff.', linkLabel: 'Network and 5G' },
    { media: 'Apps', title: 'Apps billed to your balance', href: href('/apps/'),
      body: 'Kinon, Yandex Plus, Busuu and Litres charged straight to your mobile balance.', linkLabel: 'See all apps' },
    { media: 'Zero balance', title: 'Never fully out of credit', href: href('/tariffs/services/zero-balance/'),
      body: 'SimCredit and Paycell keep you connected when your balance runs out.', linkLabel: 'Zero balance options' },
    { media: 'Community', title: 'Supporting people and communities', href: href('/about/sustainability/'),
      body: 'Education, environment and social welfare programmes across Azerbaijan.', linkLabel: 'Sustainability' }
  ];

  /* ------------------------------------------------------------- Sections */

  function section(inner, modifier) {
    return '<section class="section' + (modifier ? ' ' + modifier : '') + '"><div class="wrap">' + inner + '</div></section>';
  }

  function take(list, max) {
    return list.slice(0, max);
  }

  var planCards = plans.map(function (plan) { return render('planCard', plan); }).join('');

  var devicesSection =
    render('sectionHead', {
      eyebrow: 'Devices',
      title: 'Shop your favourite brands',
      body: 'The latest devices with flexible payments. Filter by category and brand.',
      action: { label: 'All devices', href: href('/devices/') }
    }) +
    render('splitBanner', {
      eyebrow: 'Featured device',
      title: 'iPhone 16 Pro',
      body: 'From 2,949 AZN, with three months of 55GB data included.',
      media: 'iPhone 16 Pro',
      actions: [{ label: 'Device details', href: href('/devices/'), variant: 'primary' }],
      note: 'Purchase happens in an Azercell store until the online shop launches.'
    }) +
    '<div data-filter-scope style="margin-top: var(--sp-6)">' +
      render('filterTabs', {
        groups: [
          { key: 'category', label: 'Device category', options: [
            { value: 'all', label: 'All' },
            { value: 'phones', label: 'Phones' },
            { value: 'tablets', label: 'Tablets' },
            { value: 'routers', label: 'Routers' },
            { value: 'accessories', label: 'Accessories' }

          { key: 'brand', label: 'Brand', options: [

            { value: 'apple', label: 'Apple' },
            { value: 'samsung', label: 'Samsung' },
            { value: 'honor', label: 'Honor' }
          ] }
        ]
      }) +
      '<div class="grid grid--4" data-filter-target>' +
        take(devices, 8).map(function (device) {
          return render('deviceCard', {
            name: device.name,
            category: device.category,
            brand: device.brand,
            priceLabel: 'Starting from',
            price: device.price,
            action: { label: 'Device details', href: href('/devices/') }
          });
        }).join('') +
      '</div>' +
      '<p class="t-body t-muted" data-filter-empty hidden style="margin-top: var(--sp-4)">' +
        'No devices match this combination. Choose another category or brand.</p>' +
    '</div>';

  Components.mount('#page-main', [
    ['heroBanner', { slides: heroSlides }],

    render('acquisitionBlock', chrome.acquisition),

    section(
      render('sectionHead', {
        eyebrow: 'Tariffs',
        title: 'Pick your perfect plan',
        body: 'Flexible plans built around how you actually use your phone. Choose a price to see what it includes.',
        action: { label: 'Compare all plans', href: href('/tariffs/compare/') }

        title: 'Dive into the world of cinema',
        body: '240+ channels plus Viju, Wink and Premier on demand. Up to 5 profiles on 3 devices.',
        media: 'Kinon Plus',
        inverse: true,
        flip: true,
        points: [
