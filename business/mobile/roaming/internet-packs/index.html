(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  Components.mount('#page-top', [['announcementBar', { messages: chrome.announcements }], ['siteHeader', R.headerProps({ branch: 'business' })]]);

  PrototypeApp.init();
})();
