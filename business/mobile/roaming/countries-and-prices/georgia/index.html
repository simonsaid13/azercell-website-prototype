(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  Components.mount('#page-top', [['announcementBar', { messages: chrome.announcements }], ['siteHeader', R.headerProps({ branch: 'business' })]]);
  Components.mount('#page-bottom', [['siteFooter', chrome.businessFooter]]);
  Components.mount('#page-chat', [['floatingBar', chrome.businessFloatingBar]]);
  BusinessRoamingPage.mount('country', 'georgia');
  PrototypeApp.init();
})();
</script>
