<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business roaming countries and prices — Azercell</title>
<meta name="description" content="Corporate postpaid roaming rates for Turkiye, Georgia and Germany.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body>
<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/business-roaming-data.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/business-roaming-page.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: Business header and floating bar → Roaming → Countries and prices;
 *          Roaming overview and all country pages — CONNECTED
 * OUTBOUND: search results → Turkiye, Georgia, Germany — CONNECTED;
 *           inline searchable internet-pack coverage table — CONNECTED
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'business' })]
  ]);
  Components.mount('#page-bottom', [['siteFooter', chrome.businessFooter]]);
  Components.mount('#page-chat', [['floatingBar', chrome.businessFloatingBar]]);
  BusinessRoamingPage.mount('countries');
  PrototypeApp.init();
})();
</script>
</body>
</html>
