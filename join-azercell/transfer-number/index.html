<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer your number — Azercell</title>
<meta name="description" content="Bring your existing number to Azercell. Start the transfer on azercellim.com.">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/hotjar.js"></script>
</head>
<body class="cmp-nav-transfer-page">

<div id="page-top"></div>
<main id="page-main"></main>
<div id="page-bottom"></div>
<div id="page-chat"></div>

<script src="/assets/js/site-registry.js"></script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/app.js"></script>
<script>
/* PAGE CONNECTIONS — full map: PAGE_CONNECTIONS.md
 * INBOUND: homepage acquisition → Transfer your number; header Mobile → e-Sim → Move number to e-SIM
 * OUTBOUND:
 *   transferHero → Start transfer — CONNECTED (azercellim.com)
 *   floatingBar → Start transfer — CONNECTED (azercellim.com, after hero scrolls away)
 *   floatingBar → Search — PLANNED (/search/)
 *   header/footer — SITE_CHROME.nav + SITE_CHROME.footer (mixed built/planned via href())
 */
(function () {
  var R = SiteRegistry;
  var chrome = R.SITE_CHROME;
  var AZERCELLIM = 'https://azercellim.com/en/home';

  Components.mount('#page-top', [
    ['announcementBar', { messages: chrome.announcements }],
    ['siteHeader', R.headerProps({ branch: 'personal' })]
  ]);

  Components.mount('#page-bottom', [['siteFooter', chrome.footer]]);
  Components.mount('#page-chat', [['floatingBar', {
    mode: 'transfer',
    search: chrome.floatingBar.search,
    cta: { label: 'Start transfer', href: AZERCELLIM }
  }]]);

  Components.mount('#page-main', [
    ['transferHero', {
      title: 'Transfer your number',
      media: 'Transfer visual',
      action: { label: 'Start transfer', href: AZERCELLIM }
    }],
    ['mediaPlaceholder', { label: 'Transfer content placeholder 1', media: '' }],
    ['mediaPlaceholder', { label: 'Transfer content placeholder 2', media: '' }],
    ['mediaPlaceholder', { label: 'Transfer content placeholder 3', media: '' }]
  ]);

  PrototypeApp.init();
})();
</script>
</body>
</html>
